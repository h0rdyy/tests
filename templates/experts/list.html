<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Команда</title><link rel="stylesheet" href="/static/css/main.css"></head><body class="page--sub">{% include 'partials/header.html' %}<main class="page" style="padding-top:8rem;max-width:1200px;margin:auto;padding-left:clamp(1.5rem,5vw,2.7rem);padding-right:clamp(1.5rem,5vw,2.7rem)"><h1 class="section__title">Команда</h1><p style="text-align:center;color:#a0a0b0;margin-bottom:3rem">Наши специалисты по информационной безопасности</p><div class="experts-grid">{% for person in staffs %}<article class="expert-card"><a href="/experts/{{ person.ID }}">{% if person.PhotoURL %}<img src="{{ person.PhotoURL }}" alt="{{ person.FullName }}">{% endif %}<h2>{{ person.FullName }}</h2><p>{{ person.Position }}</p><p>{{ person.ShortInfo }}</p><span>Подробнее</span></a></article>{% endfor %}</div></main></body></html>
