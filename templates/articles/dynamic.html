<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ article.Title }}</title><link rel="stylesheet" href="/static/css/main.css"></head><body class="page--sub">{% include 'partials/header.html' %}<main class="page content-page" style="padding-top:clamp(6.5rem,10vw,8rem);max-width:1200px;margin:0 auto;padding-left:clamp(1.5rem,5vw,2.7rem);padding-right:clamp(1.5rem,5vw,2.7rem);padding-bottom:4rem"><div class="article-hero">{% if article.CoverURL %}<img src="{{ article.CoverURL }}" alt="{{ article.Title }}" class="article-hero__bg">{% endif %}<div class="article-hero__overlay"></div><div class="article-hero__content">{% for tag in article.Tags %}<span class="article-hero__badge">{{ tag }}</span>{% endfor %}<h1 class="article-hero__title">{{ article.Title }}</h1></div></div><div class="article-body"><div class="article-body__markdown">{% if article.PublishDate %}<time class="article-body__date">{{ article.PublishDate }}</time>{% endif %}{{ article.ContentHTML|safe }}</div></div></main><script type="module" src="/static/js/page-common.js"></script></body></html>
